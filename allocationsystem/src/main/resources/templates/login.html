<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Sign In | St. Xavier's College Room Allocation</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/xavier-theme.css}">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(circle at top center, #131f3d 0%, #0a1124 70%);
        }
        .login-box {
            width: 100%;
            max-width: 440px;
            background: var(--xavier-surface);
            border: 1px solid var(--xavier-border);
            border-radius: var(--radius-lg);
            padding: 36px 32px;
            box-shadow: var(--shadow-lg);
        }
        .login-crest-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-crest-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 14px;
            background: linear-gradient(135deg, var(--xavier-card) 0%, #1e2c4f 100%);
            border: 2px solid var(--xavier-gold);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: var(--xavier-gold);
            box-shadow: 0 0 16px rgba(212, 175, 55, 0.3);
        }
        .login-college-title {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--text-primary);
        }
        .login-sub-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .quick-login-section {
            background: var(--xavier-card);
            border: 1px solid var(--xavier-border);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 24px;
        }
        .quick-login-title {
            font-size: 0.74rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 700;
            color: var(--xavier-gold);
            margin-bottom: 10px;
            text-align: center;
        }
        .quick-login-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .btn-quick-login {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 6px;
            background: var(--xavier-surface);
            border: 1px solid var(--xavier-border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 600;
            transition: all 0.2s;
            text-align: center;
        }
        .btn-quick-login:hover {
            border-color: var(--xavier-gold);
            background: var(--xavier-gold-muted);
            color: var(--xavier-gold);
            transform: translateY(-2px);
        }
        .btn-quick-login span.icon {
            font-size: 1.2rem;
            margin-bottom: 4px;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 600;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--xavier-border);
        }
        .divider::before { margin-right: 12px; }
        .divider::after { margin-left: 12px; }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-box">
        <div class="login-crest-header">
            <div class="login-crest-icon">🏛️</div>
            <h2 class="login-college-title">ST. XAVIER'S COLLEGE</h2>
            <p class="login-sub-text">Campus Room & Space Allocation System</p>
        </div>

        <!-- 1-Click Presentation Demo Switcher -->
        <div class="quick-login-section">
            <div class="quick-login-title">⚡ 1-Click Instant Demo Login</div>
            <div class="quick-login-grid">
                <a th:href="@{/switch-role(role='STUDENT')}" class="btn-quick-login">
                    <span class="icon">🎓</span>
                    <span>Student</span>
                </a>
                <a th:href="@{/switch-role(role='HOD')}" class="btn-quick-login">
                    <span class="icon">👨‍🏫</span>
                    <span>HOD</span>
                </a>
                <a th:href="@{/switch-role(role='ADMIN')}" class="btn-quick-login">
                    <span class="icon">⚙️</span>
                    <span>Admin</span>
                </a>
            </div>
        </div>

        <div class="divider">or sign in with password</div>

        <div th:if="${param.error}" class="xavier-alert xavier-alert-danger" style="margin-bottom: 16px; padding: 8px 12px; font-size: 0.8rem;">
            ⚠️ Invalid email or password. Please try again.
        </div>
        <div th:if="${param.logout}" class="xavier-alert xavier-alert-success" style="margin-bottom: 16px; padding: 8px 12px; font-size: 0.8rem;">
            ✓ You have been logged out successfully.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label class="form-label" for="username">College Email ID</label>
                <input type="email" id="username" name="username" class="form-control" placeholder="e.g. student@test.com" required autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-xavier-primary" style="width: 100%; justify-content: center; margin-top: 8px;">
                Sign In to Portal
            </button>
        </form>
    </div>
</div>

</body>
</html>
