<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>HOD Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>HOD Dashboard</h2>
        <div>
            <span class="text-muted" th:text="${hod.name} + ' — ' + ${hod.department}"></span>
            <form th:action="@{/logout}" method="post" class="d-inline ms-3">
                <button type="submit" class="btn btn-outline-secondary btn-sm">Logout</button>
            </form>
        </div>
    </div>

    <h4>Pending Requests — <span th:text="${hod.department}"></span></h4>

    <table class="table table-bordered mt-3">
        <thead class="table-light">
        <tr>
            <th>Room</th>
            <th>Requested By</th>
            <th>Date</th>
            <th>Time</th>
            <th>Purpose</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${pendingBookings.isEmpty()}">
            <td colspan="6" class="text-center text-muted">No pending requests</td>
        </tr>
        <tr th:each="booking : ${pendingBookings}">
            <td th:text="${booking.room.name}"></td>
            <td th:text="${booking.requestedBy.name}"></td>
            <td th:text="${booking.date}"></td>
            <td th:text="${booking.startTime} + ' - ' + ${booking.endTime}"></td>
            <td th:text="${booking.purpose}"></td>
            <td>
                <form th:action="@{/hod/bookings/{id}/approve(id=${booking.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-success btn-sm">Approve</button>
                </form>
                <form th:action="@{/hod/bookings/{id}/reject(id=${booking.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-danger btn-sm">Reject</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
