<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule View | College Room Booking System</title>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --border: #334155;
            --info: #06b6d4;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* Navbar style */
        .navbar {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .navbar-brand .logo-dot {
            width: 10px;
            height: 10px;
            background: var(--primary);
            border-radius: 50%;
            display: inline-block;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-link:hover {
            color: var(--text-primary);
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 30px;
        }

        .header {
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-secondary);
            margin: 5px 0 0 0;
            font-size: 0.95rem;
        }

        /* Filter panel style */
        .filter-panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
        }

        .filter-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)) auto;
            gap: 20px;
            align-items: flex-end;
        }

        @media (max-width: 768px) {
            .filter-form {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            margin: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            box-sizing: border-box;
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.2s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Schedule Grid/Table Card */
        .section-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
            color: var(--text-primary);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .badge-approved {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }

        .empty-state {
            text-align: center;
            padding: 50px 0;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }
    <link rel="stylesheet" th:href="@{/css/xavier-theme.css}">
</head>
<body>

<!-- Top Institutional Strip -->
<div class="xavier-top-strip">
    <div>
        <a href="https://xaviers.edu" target="_blank">xaviers.edu</a>
        <a href="#">NIRF</a>
        <a href="#">IQAC</a>
    </div>
    <div style="font-weight: 600; letter-spacing: 0.04em;">
        ESTD. 1869 • EMPOWERED AUTONOMOUS INSTITUTE
    </div>
</div>

<!-- Header -->
<header class="xavier-header">
    <div class="xavier-header-inner">
        <div class="xavier-brand">
            <svg class="xavier-crest-emblem" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
                <path d="M10,10 L90,10 L90,65 C90,95 50,115 50,115 C50,115 10,95 10,65 Z" fill="#ffffff" stroke="#b38728" stroke-width="4"/>
                <path d="M14,14 L50,14 L50,55 L14,55 Z" fill="#1e3a8a"/>
                <circle cx="32" cy="34" r="10" fill="#d4af37"/>
                <path d="M50,14 L86,14 L86,55 L50,55 Z" fill="#741114"/>
                <rect x="50" y="14" width="18" height="20" fill="#ffffff"/>
                <rect x="68" y="34" width="18" height="21" fill="#ffffff"/>
                <path d="M22,78 Q50,62 78,78 Q50,102 22,78" fill="#1e2430"/>
            </svg>
            <div class="xavier-title-group">
                <h1>ST. XAVIER'S COLLEGE, MUMBAI <span class="xavier-role-badge-tag">SCHEDULE VIEW</span></h1>
                <div class="xavier-sub-title">Campus Room & Space Allocation System</div>
            </div>
        </div>

        <!-- Role Switcher & User Controls -->
        <div class="xavier-switch-menu">
            <div class="role-switch-dropdown">
                <button type="button" class="btn-switch-portal">
                    <span>Switch Portal</span>
                    <span style="font-size: 0.65rem;">▼</span>
                </button>
                <div class="role-dropdown-content">
                    <div class="role-dropdown-header">Switch Portal (Requires Password)</div>
                    <a th:href="@{/switch-role(role='STUDENT')}" class="role-dropdown-item">
                        🎓 Student Portal
                        <span class="desc">student@test.com</span>
                    </a>
                    <a th:href="@{/switch-role(role='HOD')}" class="role-dropdown-item">
                        👨‍🏫 HOD Review Portal
                        <span class="desc">hod@test.com</span>
                    </a>
                    <a th:href="@{/switch-role(role='ADMIN')}" class="role-dropdown-item">
                        ⚙️ Central Admin Console
                        <span class="desc">admin@test.com</span>
                    </a>
                </div>
            </div>

            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="btn-header-logout">Logout</button>
            </form>
        </div>
    </div>
</header>

<div class="container">
    <div class="header">
        <div>
            <h1>Approved Room Schedule</h1>
            <p>View all approved room and hall bookings. Use filters to query by room, date, or department.</p>
        </div>
        <div>
            <a href="/dashboard" class="btn btn-secondary">← Back to Dashboard</a>
        </div>
    </div>

    <!-- Filter Panel -->
    <div class="filter-panel">
        <form action="/schedule" method="get" class="filter-form">
            <div class="form-group">
                <label for="room">Filter by Room</label>
                <select id="room" name="roomId">
                    <option value="">All Rooms</option>
                    <option th:each="room : ${rooms}"
                            th:value="${room.id}"
                            th:text="${room.name + ' (' + room.building + ')'}"
                            th:selected="${room.id == selectedRoomId}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="date">Filter by Date</label>
                <input type="date" id="date" name="date" th:value="${selectedDate}">
            </div>

            <div class="form-group">
                <label for="department">Filter by Dept</label>
                <select id="department" name="department">
                    <option value="">All Departments</option>
                    <option th:each="dept : ${departments}"
                            th:value="${dept}"
                            th:text="${dept}"
                            th:selected="${dept == selectedDepartment}">
                    </option>
                </select>
            </div>

            <div class="button-group">
                <button type="submit" class="btn btn-primary">Apply Filters</button>
                <a href="/schedule" class="btn btn-secondary">Reset</a>
            </div>
        </form>
    </div>

    <!-- Schedule Table -->
    <div class="section-card">
        <div class="table-responsive">
            <div th:if="${#lists.isEmpty(bookings)}" class="empty-state">
                <div class="empty-icon">📅</div>
                <p>No approved bookings found matching the filters.</p>
            </div>
            <table th:unless="${#lists.isEmpty(bookings)}">
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Time Slot</th>
                    <th>Room</th>
                    <th>Building</th>
                    <th>Reserved By</th>
                    <th>Department</th>
                    <th>Purpose / Event</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="booking : ${bookings}">
                    <td th:text="${booking.date}" style="font-weight: 600;">Date</td>
                    <td th:text="${booking.startTime + ' - ' + booking.endTime}">Time</td>
                    <td th:text="${booking.room.name}" style="color: var(--info); font-weight: 500;">Room</td>
                    <td th:text="${booking.room.building}">Building</td>
                    <td th:text="${booking.requestedBy.name}">User Name</td>
                    <td th:text="${booking.requestedBy.department}">Department</td>
                    <td th:text="${booking.purpose}">Purpose</td>
                    <td>
                        <span class="badge-approved">APPROVED</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
