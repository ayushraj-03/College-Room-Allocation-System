spring.application.name=allocationsystem
server.port=${PORT:8081}

# Database Configuration (Supabase PostgreSQL Cloud)
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres?sslmode=require&connectTimeout=10&socketTimeout=30&tcpKeepAlive=true}
spring.datasource.username=${DB_USERNAME:postgres.jaqwplajvajxcbyvhkek}
spring.datasource.password=${DB_PASSWORD:collegeroomallocationsystem}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Turn off verbose SQL console dumping to eliminate terminal lag
spring.jpa.show-sql=false

# HikariCP Connection Pool Optimization for Supabase Cloud (prevents idle drops & timeouts)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=90000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# Disable Thymeleaf caching so updates appear immediately
spring.thymeleaf.cache=false

